<svg xmlns="http://www.w3.org/2000/svg" width="830" height="576" viewBox="0 0 830 576" role="img" aria-label="AcademeRAG architecture checked against source: ingestion, question path, parallel retrieval, ranking and generation.">
  <title>AcademeRAG architecture</title>

  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", "Liberation Mono", monospace; }
    .h  { font-size: 12px; font-weight: 700; letter-spacing: 1px; }
    .d  { font-size: 12px; fill: #9AA7B8; }
    .bl { font-size: 11px; letter-spacing: 2px; fill: #9AA7B8; }

    @keyframes flow { from { stroke-dashoffset: 12; } to { stroke-dashoffset: 0; } }
    .fl { stroke-dasharray: 6 6; }
    @media (prefers-reduced-motion: no-preference) {
      .fl { animation: flow 1.2s linear infinite; }
    }
  </style>

  <defs>
    <marker id="mi" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0 .5 6 3.5 0 6.5Z" fill="#7DD3FC"/>
    </marker>
    <marker id="ml" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0 .5 6 3.5 0 6.5Z" fill="#A3E635"/>
    </marker>
  </defs>

  <rect width="830" height="576" rx="12" fill="#0A0F14"/>
  <rect x=".75" y=".75" width="828.5" height="574.5" rx="12" fill="none" stroke="#2B3A47" stroke-width="1.5"/>

  <!-- Header -->
  <text class="mono" x="24" y="30" font-size="12" fill="#A3E635" textLength="262" lengthAdjust="spacing">ACADEMERAG QUESTION ANSWERING</text>
  <text class="mono" x="806" y="30" font-size="11" fill="#7C8B9C" text-anchor="end">PRIVATE REPOSITORY, CHECKED AGAINST CODE</text>
  <path d="M24 44H806" stroke="#2B3A47"/>

  <!-- 01 / INGESTION (offline) -->
  <text class="mono bl" x="24" y="66">01 / INGESTION, OFFLINE</text>
  <g fill="#0F161D" stroke="#7DD3FC" stroke-opacity=".6">
    <rect x="24"  y="76" width="252" height="68" rx="7"/>
    <rect x="289" y="76" width="252" height="68" rx="7"/>
    <rect x="554" y="76" width="252" height="68" rx="7"/>
  </g>
  <g class="mono">
    <text class="h" x="38"  y="100" fill="#7DD3FC">PDF CORPUS</text>
    <text class="d" x="38"  y="119">PDF header check</text>
    <text class="d" x="38"  y="135">Sandboxed parsing</text>

    <text class="h" x="303" y="100" fill="#7DD3FC">CHUNKING</text>
    <text class="d" x="303" y="119">1000-char chunks</text>
    <text class="d" x="303" y="135">Page, unit metadata</text>

    <text class="h" x="568" y="100" fill="#7DD3FC">EMBED AND INDEX</text>
    <text class="d" x="568" y="119">bge-m3 via Ollama</text>
    <text class="d" x="568" y="135">Hash-based reindex</text>
  </g>
  <g stroke="#7DD3FC" stroke-width="1.4" opacity=".85">
    <path d="M278 110h9" marker-end="url(#mi)"/>
    <path d="M543 110h9" marker-end="url(#mi)"/>
  </g>

  <!-- 02 / QUESTION PATH -->
  <text class="mono bl" x="24" y="190">02 / QUESTION PATH</text>
  <g fill="#0F161D" stroke="#A3E635" stroke-opacity=".6">
    <rect x="24"  y="200" width="252" height="68" rx="7"/>
    <rect x="289" y="200" width="252" height="68" rx="7"/>
    <rect x="554" y="200" width="252" height="68" rx="7"/>
  </g>
  <g class="mono">
    <text class="h" x="38"  y="224" fill="#A3E635">REACT CLIENT</text>
    <text class="d" x="38"  y="243">Streaming, stoppable</text>
    <text class="d" x="38"  y="259">Sanitized Markdown</text>

    <text class="h" x="303" y="224" fill="#A3E635">DJANGO API</text>
    <text class="d" x="303" y="243">JWT auth, rate limits</text>
    <text class="d" x="303" y="259">ask and ask/stream</text>

    <text class="h" x="568" y="224" fill="#A3E635">QUERY PREP</text>
    <text class="d" x="568" y="243">Query rewrite,</text>
    <text class="d" x="568" y="259">dynamic top-k</text>
  </g>
  <g stroke="#A3E635" stroke-width="1.4" opacity=".85">
    <path d="M278 234h9" marker-end="url(#ml)"/>
    <path d="M543 234h9" marker-end="url(#ml)"/>
  </g>

  <path class="fl" d="M680 268V282H12V358H22" fill="none" stroke="#A3E635" stroke-width="1.5" marker-end="url(#ml)"/>

  <!-- 03 / RETRIEVAL (parallel legs) -->
  <text class="mono bl" x="24" y="314">03 / RETRIEVAL, LEGS RUN IN PARALLEL</text>
  <g fill="#0F161D" stroke="#A3E635" stroke-opacity=".6">
    <rect x="24"  y="324" width="252" height="68" rx="7"/>
    <rect x="289" y="324" width="252" height="68" rx="7"/>
    <rect x="554" y="324" width="252" height="68" rx="7"/>
  </g>
  <g class="mono">
    <text class="h" x="38"  y="348" fill="#A3E635">DENSE LEG</text>
    <text class="d" x="38"  y="367">Zilliz behind breaker</text>
    <text class="d" x="38"  y="383">Milvus Lite fallback</text>

    <text class="h" x="303" y="348" fill="#A3E635">BM25 LEG</text>
    <text class="d" x="303" y="367">In-process index</text>
    <text class="d" x="303" y="383">Local PDF corpus</text>

    <text class="h" x="568" y="348" fill="#A3E635">FUSION</text>
    <text class="d" x="568" y="367">Weighted score fusion</text>
    <text class="d" x="568" y="383">Dense weight 0.6</text>
  </g>
  <text class="mono" x="282.5" y="364" font-size="16" font-weight="700" fill="#A3E635" text-anchor="middle">+</text>
  <path d="M543 358h9" stroke="#A3E635" stroke-width="1.4" opacity=".85" marker-end="url(#ml)"/>

  <path class="fl" d="M680 392V406H12V482H22" fill="none" stroke="#A3E635" stroke-width="1.5" marker-end="url(#ml)"/>

  <!-- 04 / RANK, CONTEXT AND ANSWER -->
  <text class="mono bl" x="24" y="438">04 / RANK, CONTEXT AND ANSWER</text>
  <g fill="#0F161D" stroke="#A3E635" stroke-opacity=".6">
    <rect x="24"  y="448" width="252" height="68" rx="7"/>
    <rect x="289" y="448" width="252" height="68" rx="7"/>
    <rect x="554" y="448" width="252" height="68" rx="7"/>
  </g>
  <g class="mono">
    <text class="h" x="38"  y="472" fill="#A3E635">RERANK</text>
    <text class="d" x="38"  y="491">bge-reranker-v2-m3</text>
    <text class="d" x="38"  y="507">Cutoff 0.3 (default)</text>

    <text class="h" x="303" y="472" fill="#A3E635">CONTEXT</text>
    <text class="d" x="303" y="491">Neighbor chunks added</text>
    <text class="d" x="303" y="507">Syllabus page boost</text>

    <text class="h" x="568" y="472" fill="#A3E635">GENERATION</text>
    <text class="d" x="568" y="491">Groq, then Ollama</text>
    <text class="d" x="568" y="507">No mid-stream switch</text>
  </g>
  <g stroke="#A3E635" stroke-width="1.4" opacity=".85">
    <path d="M278 482h9" marker-end="url(#ml)"/>
    <path d="M543 482h9" marker-end="url(#ml)"/>
  </g>

  <!-- Scope -->
  <g class="mono" font-size="11" fill="#9AA7B8">
    <text x="24" y="540">Checked against the source on 2026-10-03. Values shown are code defaults.</text>
    <text x="24" y="556">The repository is not public. The profile makes no quality claim for it.</text>
  </g>
</svg>
